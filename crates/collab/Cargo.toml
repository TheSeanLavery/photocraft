[package]
name = "photocraft-collab"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = []
native = ["dep:webrtc", "dep:tokio", "dep:axum", "dep:reqwest", "dep:bytes", "dep:rand", "dep:sha2"]

[dependencies]
photocraft-paint.workspace = true
photocraft-doc.workspace = true
photocraft-raster.workspace = true
photocraft-geom.workspace = true
photocraft-color.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ciborium = "0.2"
serde_bytes = "0.11"
ruzstd = "0.9"
photocraft-format.workspace = true
blake3 = { version = "1.8", default-features = false, features = ["pure"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
webrtc = { version = "0.14", optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"], optional = true }
axum = { version = "0.8", optional = true }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"], optional = true }
bytes = { version = "1", optional = true }
rand = { version = "0.9", optional = true }
sha2 = { version = "0.10", optional = true }

[lints]
workspace = true
