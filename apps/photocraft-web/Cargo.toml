[package]
name = "photocraft-web"
description = "Photocraft in the browser (eframe web runner, WebGPU with WebGL2 fallback)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[features]
# Open HEIC/HEIF photos (the optional photocraft-heif crate). Not default so distributors choose
# it; official builds (CI, packaging/, release) build with `--features heif`.
heif = ["photocraft-codecs/heif"]

[lints]
workspace = true

[[bin]]
name = "photocraft-web"
path = "src/main.rs"

[[bin]]
name = "photocraft-wire-worker"
path = "src/wire_worker.rs"

[dependencies]
photocraft-collab.workspace = true
photocraft-format.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_bytes = "0.11"
photocraft-engine = { workspace = true }
photocraft-io = { workspace = true }
photocraft-codecs = { workspace = true }
photocraft-doc = { workspace = true }
photocraft-ui-egui = { workspace = true }
egui = { workspace = true }
log = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# `wgpu` pulls egui-wgpu's defaults: WebGPU plus the WebGL2 fallback.
eframe = { workspace = true, features = ["wgpu", "accesskit"] }
rfd = { workspace = true, features = ["file-handle-inner"] }
serde-wasm-bindgen = "0.6"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "HtmlElement", "HtmlCanvasElement", "HtmlAnchorElement", "Blob", "BlobPropertyBag", "Url", "Location", "History", "CssStyleDeclaration", "Storage", "Event", "EventTarget", "MouseEvent", "PointerEvent", "Request", "RequestInit", "Headers", "Response", "RtcPeerConnection", "RtcConfiguration", "RtcDataChannel", "RtcDataChannelInit", "RtcDataChannelEvent", "RtcDataChannelState", "RtcDataChannelType", "RtcSessionDescriptionInit", "RtcSessionDescription", "RtcSdpType", "RtcIceGatheringState", "MessageEvent", "AbortController", "AbortSignal", "Performance", "ReadableStream", "ReadableStreamDefaultReader", "MessageChannel", "MessagePort", "Worker", "DedicatedWorkerGlobalScope", "WorkerGlobalScope", "BeforeUnloadEvent", "DomException", "IdbFactory", "IdbOpenDbRequest", "IdbDatabase", "IdbRequest", "IdbTransaction", "IdbTransactionMode", "IdbObjectStore", "IdbCursor", "IdbCursorWithValue", "Navigator"] }

[dev-dependencies]
serde_json = { workspace = true }
photocraft-paint = { workspace = true }
photocraft-psd = { workspace = true }
