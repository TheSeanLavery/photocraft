<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>PhotoCraft</title>
  <link data-trunk rel="copy-file" href="../../assets/app-icon/hicolor/256x256/apps/ai.storyteller.photocraft.png" />
  <link rel="icon" type="image/png" href="ai.storyteller.photocraft.png" />
  <link data-trunk rel="rust" data-bin="photocraft-web" data-cargo-profile="wasm-release" data-cargo-features="heif" data-wasm-opt="z" data-weak-refs />
  <link data-trunk rel="rust" data-bin="photocraft-wire-worker" data-type="worker" data-loader-shim data-cargo-profile="wasm-release" data-cargo-features="heif" data-wasm-opt="z" data-weak-refs />
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #262626; }
    #photocraft_canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    #photocraft_launch { position: absolute; inset: 0; z-index: 1; background: #262626; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; color: #eee; text-align: center; font: 24px system-ui, sans-serif; }
    #photocraft_launch p { font: 14px system-ui, sans-serif; }
    #photocraft_launch a { color: #eee; }
    #photocraft_launch button { border: 0; border-radius: 8px; padding: 16px 48px; background: #3095f5; color: white; font: 600 20px system-ui, sans-serif; cursor: pointer; }
    #photocraft_launch button:disabled { opacity: 0.5; cursor: wait; }
    #photocraft_launch button:focus-visible { outline: 3px solid white; outline-offset: 4px; }
    #photocraft_loading[hidden], #photocraft_launch[hidden] { display: none; }
    #photocraft_loading { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 0 16px; text-align: center; color: #b8b8b8; font: 14px system-ui, sans-serif; pointer-events: none; }
    #photocraft_loading p { margin: 0 0 8px; max-width: 420px; line-height: 1.5; }
    #photocraft_loading a { color: #e0e0e0; pointer-events: auto; }
    /* The app removes this element once it runs. If the WebAssembly never downloads or doesn't match
       this page, no Rust runs to say so, so the page itself shows what to do after a while. */
    #photocraft_stalled, #photocraft_startup_stalled { color: #8c8c8c; visibility: hidden; animation: photocraft-stalled 0s 20s forwards; }
    @keyframes photocraft-stalled { to { visibility: visible; } }
  </style>
</head>
<body>
  <canvas id="photocraft_canvas"></canvas>
  <div id="photocraft_launch">
    <strong>PhotoCraft</strong>
    <button id="photocraft_launch_button" type="button" disabled>Loading&hellip;</button>
    <p id="photocraft_stalled">If loading stalls, <a href="">Reload</a> to try again.</p>
  </div>
  <div id="photocraft_loading" hidden>
    <p>Loading PhotoCraft&hellip;</p>
    <p id="photocraft_startup_stalled">This is taking longer than usual. If PhotoCraft doesn't start, its files may have failed to
      download or come from a different version of this page. <a href="">Reload</a> to try again; the browser
      console lists what failed.</p>
  </div>
</body>
</html>
