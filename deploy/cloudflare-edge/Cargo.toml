[package]
name = "photocraft-cloudflare-edge"
version = "0.1.0"
edition = "2024"
publish = false

# Deployment tooling is independent of the editor's dependency layers.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(target_arch = "wasm32")'.dependencies]
worker = "=0.8.7"
futures-util = "0.3"
getrandom = { version = "0.2", features = ["js"] }

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1

